<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;500;600&family=Jost:wght@300;400;500&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
doc-page:not(:defined){visibility:hidden}
body{margin:0;font-family:'Jost',system-ui,sans-serif;color:#141A3A}
a{color:#23294A}a:hover{color:#A68B71}
</style>
<script src="./doc-page.js"></script>
</helmet>
<svg width="0" height="0" style="position: absolute" aria-hidden="true"><defs>
<symbol id="sym-door" viewBox="0 0 120 120"><rect x="12" y="12" width="24" height="96"></rect><polygon points="44,12 108,12 44,58"></polygon><polygon points="44,62 108,108 44,108"></polygon><rect x="80" y="54" width="12" height="12" transform="rotate(45 86 60)"></rect></symbol>
</defs></svg>
<doc-page width="91mm" height="61mm">
<section class="page" id="front" data-screen-label="Front" style="--foil: {{ foil }}; --blue: {{ blue }}; position: relative; overflow: hidden; background: var(--blue, #23294A); font-family: 'Jost', system-ui, sans-serif">
<div style="position: absolute; left: 3mm; top: 3mm; width: 85mm; height: 55mm; box-sizing: border-box; padding: 6mm 6.5mm; display: flex; flex-direction: column; justify-content: space-between">
<div style="display: flex; justify-content: space-between; align-items: flex-start">
<svg width="7.5mm" height="7.5mm" viewBox="0 0 120 120" aria-label="Kingdom Entry mark"><use href="#sym-door" fill="var(--foil, #A68B71)"></use></svg>
<div style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 8.5pt; letter-spacing: 0.18em; color: var(--foil, #A68B71)"><span style="font-weight: 600">KINGDOM</span><span style="font-weight: 300">ENTRY</span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 1mm">
<div style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 15pt; font-weight: 600; color: #F4F1EA; line-height: 1">Amer Assiri</div>
<div style="font-size: 6.5pt; letter-spacing: 0.26em; font-weight: 500; color: var(--foil, #A68B71)">PARTNER</div>
</div>
<div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 3mm; font-size: 6.5pt; line-height: 1.5; color: #F4F1EA">
<div style="white-space: nowrap"><div>Red Sea Mall</div><div>Prince Faisal Ibn Fahd, Ash Shati</div><div>Jeddah 21146, Saudi Arabia</div></div>
<div style="text-align: right; white-space: nowrap; flex-shrink: 0"><div>KSA +966 9200 17540</div><div>NL +31 624 66 4290</div><div>amer@kingdomentry.com</div><div>kingdomentry.com</div></div>
</div>
</div>
<div style="display: {{ guides }}; position: absolute; left: 3mm; top: 3mm; width: 85mm; height: 55mm; box-sizing: border-box; border: 0.2mm dashed #FF3EA5; pointer-events: none"></div>
<div style="display: {{ guides }}; position: absolute; right: 4mm; top: 0.4mm; font-size: 5pt; letter-spacing: 0.1em; color: #FF3EA5">TRIM 85 × 55 · BLEED 3 · FOIL = SPOT “FOIL”</div>
</section>
<section class="page" id="back" data-screen-label="Back" style="--foil: {{ foil }}; --blue: {{ blue }}; position: relative; overflow: hidden; background: var(--blue, #23294A); font-family: 'Jost', system-ui, sans-serif">
<div style="position: absolute; left: 3mm; top: 3mm; width: 85mm; height: 55mm; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3.5mm">
<svg width="19mm" height="19mm" viewBox="0 0 120 120" aria-label="Kingdom Entry mark"><use href="#sym-door" fill="var(--foil, #A68B71)"></use></svg>
<div style="display: flex; flex-direction: column; align-items: center; font-family: 'Amiri', serif; direction: rtl; color: var(--foil, #A68B71)">
<div style="font-size: 13pt; font-weight: 700; line-height: 1.3">كينغدوم إنتري</div>
<div style="font-size: 8.5pt; line-height: 1.3">مدخل المملكة</div>
</div>
</div>
<div style="display: {{ guides }}; position: absolute; left: 3mm; top: 3mm; width: 85mm; height: 55mm; box-sizing: border-box; border: 0.2mm dashed #FF3EA5; pointer-events: none"></div>
</section>
</doc-page>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;foil&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;bronze&quot;,&quot;options&quot;:[&quot;bronze&quot;,&quot;gold&quot;],&quot;tsType&quot;:&quot;'bronze' | 'gold'&quot;},&quot;showGuides&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;blue&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#23294A&quot;,&quot;options&quot;:[&quot;#23294A&quot;,&quot;#1435A8&quot;,&quot;#23294A&quot;,&quot;#0F2C7A&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const foil = (this.props.foil ?? 'bronze') === 'gold' ? '#A68B71' : '#A68B71';
    return { foil, blue: this.props.blue ?? '#23294A', guides: (this.props.showGuides ?? true) ? 'block' : 'none' };
  }
}
</script>
</body>
</html>
