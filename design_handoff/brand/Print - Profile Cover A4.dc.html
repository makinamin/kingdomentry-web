<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
doc-page:not(:defined){visibility:hidden}
body{margin:0;font-family:'Jost',system-ui,sans-serif;color:#141A3A}
a{color:#23294A}a:hover{color:#A68B71}
</style>
<script src="./doc-page.js"></script>
</helmet>
<svg width="0" height="0" style="position: absolute" aria-hidden="true"><defs>
<symbol id="sym-door" viewBox="0 0 120 120"><rect x="12" y="12" width="24" height="96"></rect><polygon points="44,12 108,12 44,58"></polygon><polygon points="44,62 108,108 44,108"></polygon><rect x="80" y="54" width="12" height="12" transform="rotate(45 86 60)"></rect></symbol>
<symbol id="sym-arch" viewBox="0 0 120 120"><path fill-rule="evenodd" d="M26 112 V56 C26 30 43 15 60 6 C77 15 94 30 94 56 V112 H84 V56 C84 36 72 25 60 18 C48 25 36 36 36 56 V112 Z"></path><rect x="54" y="30" width="12" height="12" transform="rotate(45 60 36)"></rect><rect x="18" y="106" width="84" height="8"></rect></symbol>
<symbol id="sym-steps" viewBox="0 0 120 120"><rect x="10" y="88" width="100" height="14"></rect><rect x="35" y="66" width="75" height="14"></rect><rect x="60" y="44" width="50" height="14"></rect><rect x="85" y="22" width="25" height="14"></rect></symbol>
<symbol id="sym-key" viewBox="0 0 120 120"><path fill-rule="evenodd" d="M12 60 a20 20 0 1 0 40 0 a20 20 0 1 0 -40 0 M22 60 a10 10 0 1 1 20 0 a10 10 0 1 1 -20 0"></path><rect x="50" y="56" width="60" height="8"></rect><rect x="82" y="64" width="8" height="14"></rect><rect x="98" y="64" width="8" height="22"></rect></symbol>
<symbol id="sym-najdi" viewBox="0 0 120 120"><rect x="10" y="94" width="100" height="14"></rect><rect x="27" y="76" width="66" height="14"></rect><rect x="44" y="58" width="32" height="14"></rect><rect x="53" y="35" width="14" height="14" transform="rotate(45 60 42)"></rect></symbol>
<symbol id="sym-keyhole" viewBox="0 0 120 120"><circle cx="60" cy="42" r="22"></circle><polygon points="48,58 72,58 84,110 36,110"></polygon></symbol>
<symbol id="sym-gate" viewBox="0 0 120 120"><path fill-rule="evenodd" d="M12 12 H108 V108 H12 Z M21 21 H56 V99 H21 Z M64 21 H99 V99 H64 Z"></path><rect x="44" y="55" width="10" height="10" transform="rotate(45 49 60)"></rect><rect x="66" y="55" width="10" height="10" transform="rotate(45 71 60)"></rect></symbol>
<symbol id="sym-portal" viewBox="0 0 120 120"><path fill-rule="evenodd" d="M8 8 H112 V112 H8 Z M18 18 H102 V102 H18 Z"></path><path fill-rule="evenodd" d="M32 32 H88 V88 H32 Z M41 41 H79 V79 H41 Z"></path><rect x="53" y="53" width="14" height="14"></rect></symbol>
<pattern id="patDense" width="120" height="60" patternUnits="userSpaceOnUse">
<use href="#sym-door" x="6" y="6" width="18" height="18" fill="var(--foil, #A68B71)"></use>
<use href="#sym-arch" x="36" y="6" width="18" height="18" fill="var(--foil, #A68B71)"></use>
<use href="#sym-key" x="66" y="6" width="18" height="18" fill="var(--foil, #A68B71)"></use>
<use href="#sym-najdi" x="96" y="6" width="18" height="18" fill="var(--foil, #A68B71)"></use>
<use href="#sym-steps" x="6" y="36" width="18" height="18" fill="var(--foil, #A68B71)"></use>
<use href="#sym-gate" x="36" y="36" width="18" height="18" fill="var(--foil, #A68B71)"></use>
<use href="#sym-keyhole" x="66" y="36" width="18" height="18" fill="var(--foil, #A68B71)"></use>
<use href="#sym-portal" x="96" y="36" width="18" height="18" fill="var(--foil, #A68B71)"></use>
</pattern>
</defs></svg>
<doc-page width="303mm" height="216mm">
<section class="page" id="cover" data-screen-label="Cover" style="--foil: {{ foil }}; --blue: {{ blue }}; position: relative; overflow: hidden; background: var(--blue, #23294A); font-family: 'Jost', system-ui, sans-serif">
<svg width="303mm" height="216mm" viewBox="0 0 303 216" style="position: absolute; inset: 0"><rect x="-1.5" y="-1.5" width="306" height="219" fill="url(#patDense)"></rect></svg>
<div style="position: absolute; left: 91.5mm; top: 68mm; width: 120mm; height: 80mm; background: var(--blue, #23294A); box-shadow: 0 0 0 0.3mm var(--foil, #A68B71); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5.5mm">
<svg width="21mm" height="21mm" viewBox="0 0 120 120" aria-label="Kingdom Entry mark"><use href="#sym-door" fill="var(--foil, #A68B71)"></use></svg>
<div style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 25pt; letter-spacing: 0.18em; color: var(--foil, #A68B71)"><span style="font-weight: 600">KINGDOM</span><span style="font-weight: 300">ENTRY</span></div>
<div style="display: flex; align-items: center; gap: 3.5mm; font-size: 8.5pt; letter-spacing: 0.32em; color: #F4F1EA"><span>COMPANY PROFILE</span><span style="width: 6mm; height: 0.3mm; background: var(--foil, #A68B71)"></span><span>2026</span></div>
</div>
<div style="display: {{ guides }}; position: absolute; left: 3mm; top: 3mm; width: 297mm; height: 210mm; box-sizing: border-box; border: 0.25mm dashed #FF3EA5; pointer-events: none"></div>
<div style="display: {{ guides }}; position: absolute; right: 5mm; top: 0.6mm; font-size: 6pt; letter-spacing: 0.1em; color: #FF3EA5">TRIM A4 297 × 210 · BLEED 3 · FOIL = SPOT “FOIL” · PLATE PRINTS PANTONE BLUE, NO FOIL</div>
</section>
</doc-page>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;foil&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;bronze&quot;,&quot;options&quot;:[&quot;bronze&quot;,&quot;gold&quot;],&quot;tsType&quot;:&quot;'bronze' | 'gold'&quot;},&quot;showGuides&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;blue&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#23294A&quot;,&quot;options&quot;:[&quot;#23294A&quot;,&quot;#1435A8&quot;,&quot;#23294A&quot;,&quot;#0F2C7A&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const foil = (this.props.foil ?? 'bronze') === 'gold' ? '#A68B71' : '#A68B71';
    return { foil, blue: this.props.blue ?? '#23294A', guides: (this.props.showGuides ?? true) ? 'block' : 'none' };
  }
}
</script>
</body>
</html>
