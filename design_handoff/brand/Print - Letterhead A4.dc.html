<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;500;600&family=Jost:wght@300;400;500&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
doc-page:not(:defined){visibility:hidden}
body{margin:0;font-family:'Jost',system-ui,sans-serif;color:#141A3A}
a{color:#23294A}a:hover{color:#A68B71}
</style>
<script src="./doc-page.js"></script>
</helmet>
<svg width="0" height="0" style="position: absolute" aria-hidden="true"><defs>
<symbol id="sym-door" viewBox="0 0 120 120"><rect x="12" y="12" width="24" height="96"></rect><polygon points="44,12 108,12 44,58"></polygon><polygon points="44,62 108,108 44,108"></polygon><rect x="80" y="54" width="12" height="12" transform="rotate(45 86 60)"></rect></symbol>
<symbol id="sym-arch" viewBox="0 0 120 120"><path fill-rule="evenodd" d="M26 112 V56 C26 30 43 15 60 6 C77 15 94 30 94 56 V112 H84 V56 C84 36 72 25 60 18 C48 25 36 36 36 56 V112 Z"></path><rect x="54" y="30" width="12" height="12" transform="rotate(45 60 36)"></rect><rect x="18" y="106" width="84" height="8"></rect></symbol>
<symbol id="sym-najdi" viewBox="0 0 120 120"><rect x="10" y="94" width="100" height="14"></rect><rect x="27" y="76" width="66" height="14"></rect><rect x="44" y="58" width="32" height="14"></rect><rect x="53" y="35" width="14" height="14" transform="rotate(45 60 42)"></rect></symbol>
<pattern id="patFriezeBlue" width="24" height="12" patternUnits="userSpaceOnUse">
<use href="#sym-najdi" x="1" y="2.5" width="7" height="7" fill="var(--blue, #23294A)"></use>
<use href="#sym-arch" x="13" y="2.5" width="7" height="7" fill="var(--blue, #23294A)"></use>
</pattern>
</defs></svg>
<doc-page width="216mm" height="303mm">
<section class="page" id="letter" data-screen-label="Letterhead" style="--foil: {{ foil }}; --blue: {{ blue }}; position: relative; overflow: hidden; background: #F4F1EA; font-family: 'Jost', system-ui, sans-serif">
<div style="position: absolute; left: 3mm; top: 3mm; width: 210mm; height: 297mm; box-sizing: border-box; padding: 18mm 20mm 0; display: flex; flex-direction: column; justify-content: space-between">
<div style="display: flex; justify-content: space-between; align-items: flex-start">
<div style="display: flex; align-items: center; gap: 4mm">
<svg width="12mm" height="12mm" viewBox="0 0 120 120" aria-label="Kingdom Entry mark"><use href="#sym-door" fill="var(--blue, #23294A)"></use></svg>
<div style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 15pt; letter-spacing: 0.18em; color: var(--blue, #23294A)"><span style="font-weight: 600">KINGDOM</span><span style="font-weight: 300">ENTRY</span></div>
</div>
<div style="text-align: right; font-size: 7.5pt; line-height: 1.6; color: #4A4D57"><div>Red Sea Mall, Prince Faisal Ibn Fahd, Ash Shati, Jeddah 21146</div><div>KSA +966 9200 17540 · NL +31 624 66 4290</div><div>amer@kingdomentry.com · kingdomentry.com</div></div>
</div>
<div style="display: flex; flex-direction: column">
<div style="height: 0.3mm; background: var(--foil, #A68B71); margin-bottom: 3mm"></div>
<div style="display: flex; justify-content: space-between; align-items: center; padding-bottom: 3mm">
<div style="font-size: 7pt; letter-spacing: 0.26em; color: #4A4D57">SOFT LANDING · SAUDI ARABIA</div>
<div style="font-family: 'Amiri', serif; font-size: 10pt; color: var(--blue, #23294A)">مدخل المملكة</div>
</div>
<svg width="216mm" height="12mm" viewBox="0 0 216 12" preserveAspectRatio="xMidYMid slice" style="display: block; margin: 0 -23mm 0 -23mm"><rect width="216" height="12" fill="url(#patFriezeBlue)"></rect></svg>
</div>
</div>
<div style="display: {{ guides }}; position: absolute; left: 3mm; top: 3mm; width: 210mm; height: 297mm; box-sizing: border-box; border: 0.25mm dashed #FF3EA5; pointer-events: none"></div>
<div style="display: {{ guides }}; position: absolute; right: 5mm; top: 0.6mm; font-size: 6pt; letter-spacing: 0.1em; color: #FF3EA5">TRIM A4 210 × 297 · BLEED 3 · RULE = SPOT “FOIL” · FRIEZE = PANTONE BLUE</div>
</section>
</doc-page>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;foil&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;bronze&quot;,&quot;options&quot;:[&quot;bronze&quot;,&quot;gold&quot;],&quot;tsType&quot;:&quot;'bronze' | 'gold'&quot;},&quot;showGuides&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;blue&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#23294A&quot;,&quot;options&quot;:[&quot;#23294A&quot;,&quot;#1435A8&quot;,&quot;#23294A&quot;,&quot;#0F2C7A&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const foil = (this.props.foil ?? 'bronze') === 'gold' ? '#A68B71' : '#A68B71';
    return { foil, blue: this.props.blue ?? '#23294A', guides: (this.props.showGuides ?? true) ? 'block' : 'none' };
  }
}
</script>
</body>
</html>
